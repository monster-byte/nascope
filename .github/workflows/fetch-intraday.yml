name: AUREX Pulse - Intraday Engine

on:
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aurex-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r aurex-ai/requirements.txt

      - name: Run data layer (fresh prices)
        working-directory: aurex-ai
        continue-on-error: true
        run: python -m src.data.run

      - name: Run Pulse engine
        working-directory: aurex-ai
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python -m src.pulse.engine

      - name: Copy data for dashboard
        run: |
          mkdir -p docs/data/prices docs/data/intraday
          cp aurex-ai/data/prices/snapshot_1D.json docs/data/prices/ || true
          cp aurex-ai/data/intraday/intraday_snapshot.json docs/data/intraday/ || true

      - name: Commit updated data
        run: |
          git config user.name "aurex-pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "chore: auto-update pulse intraday snapshot [skip ci]"
          # لو تضارب مع الـworkflow الثاني على ملفات البيانات: نسختنا (الأحدث) هي اللي تفوز، ونعيد المحاولة
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed after retries"
          exit 1
